<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>rcloneGUI</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect rx='8' width='32' height='32' fill='%236366f1'/><text x='16' y='22' font-size='18' text-anchor='middle' fill='white' font-family='system-ui' font-weight='bold'>R</text></svg>">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header class="app-header">
    <div class="header-left">
      <div class="logo-icon">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 14.899A7 7 0 1 1 15.71 8h1.79a4.5 4.5 0 0 1 2.5 8.242"/><path d="M12 12v9"/><path d="m8 17 4 4 4-4"/></svg>
      </div>
      <h1>rcloneGUI</h1>
    </div>
    <div class="header-right">
      <button class="btn-icon-header accent" onclick="openAddModal('drive')">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14"/><path d="M5 12h14"/></svg>
        <span class="btn-label">Googleドライブ</span>
      </button>
      <button class="btn-icon-header accent" onclick="openAddModal('onedrive')">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14"/><path d="M5 12h14"/></svg>
        <span class="btn-label">OneDrive</span>
      </button>
      <button class="btn-icon-header" onclick="exportSettings()">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        <span class="btn-label">エクスポート</span>
      </button>
      <button class="btn-icon-header" onclick="importSettings()">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
        <span class="btn-label">インポート</span>
      </button>
      <button class="btn-icon-header nav-btn" data-page="jobs" onclick="showPage('jobs')">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8Z"/><path d="M14 2v6h6"/><path d="M16 13H8"/><path d="M16 17H8"/><path d="M10 9H8"/></svg>
        <span class="btn-label">履歴</span>
      </button>
    </div>
  </header>

  <main class="content">
    <div id="page-main" class="page active">
      <div id="remote-cards"></div>

      <div class="schedule-section" id="schedule-section" style="display:none">
        <div class="card">
          <h3>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
            スケジュール設定
          </h3>
          <div class="schedule-time-row">
            <select id="schedule-time-select">
              <option value="">時</option>
              <option value="0">0</option><option value="1">1</option><option value="2">2</option>
              <option value="3">3</option><option value="4">4</option><option value="5">5</option>
              <option value="6">6</option><option value="7">7</option><option value="8">8</option>
              <option value="9">9</option><option value="10">10</option><option value="11">11</option>
              <option value="12">12</option><option value="13">13</option><option value="14">14</option>
              <option value="15">15</option><option value="16">16</option><option value="17">17</option>
              <option value="18">18</option><option value="19">19</option><option value="20">20</option>
              <option value="21">21</option><option value="22">22</option><option value="23">23</option>
            </select>
            <select id="schedule-min-select">
              <option value="00">:00</option><option value="15">:15</option><option value="30">:30</option><option value="45">:45</option>
            </select>
            <button class="btn btn-outline btn-sm" onclick="addSyncSchedule()">追加</button>
          </div>
          <div id="sync-schedule-list"></div>
          <div class="btn-row">
            <button class="btn btn-pastel btn-sm" onclick="saveSchedule()">スケジュール保存</button>
            <button class="btn btn-outline btn-sm" onclick="showCronInfo()">cron設定確認</button>
          </div>
          <div id="cron-info-area" style="display:none">
            <div id="cron-info-content" class="cron-info-box"></div>
          </div>
        </div>
      </div>
    </div>

    <div id="page-jobs" class="page">
      <div class="page-header">
        <h2>ジョブ履歴</h2>
        <button class="btn btn-outline btn-sm" onclick="showPage('main')">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg>
          戻る
        </button>
      </div>
      <div id="job-list"></div>
    </div>
  </main>

  <!-- Add Remote Modal -->
  <div id="modal-add" class="modal-overlay" onclick="closeModalBg(event)">
    <div class="modal" onclick="event.stopPropagation()">
      <div class="modal-header">
        <h3 id="modal-title"></h3>
        <button class="modal-close" onclick="closeModal()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
        </button>
      </div>
      <div class="modal-body" id="modal-body"></div>
    </div>
  </div>

  <!-- Auth Flow Modal -->
  <div id="modal-auth" class="modal-overlay" onclick="closeModalBg(event)">
    <div class="modal modal-auth" onclick="event.stopPropagation()">
      <div class="modal-header">
        <h3>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg>
          アカウント認証
        </h3>
        <button class="modal-close" onclick="closeModal()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
        </button>
      </div>
      <div class="modal-body">
        <p id="auth-status" style="margin:0 0 12px;font-size:0.9rem;color:var(--text2);font-weight:500"></p>
        <div id="auth-url-area" style="display:none">
          <div class="ssh-tunnel-box">
            <div class="ssh-tunnel-label">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg>
              1. SSHトンネルを接続:
            </div>
            <div class="ssh-tunnel-cmd">
              <code id="ssh-cmd"></code>
              <button class="btn btn-outline btn-sm" onclick="copySshCmd()">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg>
              </button>
            </div>
          </div>
          <div class="auth-url-box" style="margin-top:8px">
            <label>2. ブラウザでログイン:</label>
            <div class="auth-url-input-row">
              <input type="text" id="auth-url-input" readonly class="auth-url-input">
              <a id="auth-url-link" href="#" target="_blank" class="btn btn-primary btn-sm">開く</a>
              <button class="btn btn-outline btn-sm" onclick="copyAuthUrl()">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg>
              </button>
            </div>
          </div>
        </div>
        <div id="auth-done-area" style="display:none;text-align:center;padding:24px 0">
          <div style="width:48px;height:48px;border-radius:12px;background:var(--success-bg);display:flex;align-items:center;justify-content:center;margin:0 auto 12px">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="var(--success)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
          </div>
          <p style="color:var(--success);font-weight:600;font-size:1rem">認証完了</p>
        </div>
      </div>
    </div>
  </div>

  <!-- Sync Pair Add Modal -->
  <div id="modal-sync-pair" class="modal-overlay" onclick="closeModalBg(event)">
    <div class="modal" style="max-width:560px" onclick="event.stopPropagation()">
      <div class="modal-header">
        <h3>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14"/><path d="M5 12h14"/></svg>
          同期ペアを追加
        </h3>
        <button class="modal-close" onclick="closeModal()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
        </button>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <label>コピー元（サーバー側）</label>
          <input type="text" id="pair-source" placeholder="/opt/lxd-data/file">
        </div>
        <div class="form-group">
          <label>コピー先（クラウド側）</label>
          <div style="display:flex;gap:0">
            <span class="sync-pair-prefix" id="pair-prefix">gdrive:</span>
            <input type="text" id="pair-dest" class="sync-pair-dest-input" placeholder="/backup">
          </div>
        </div>
        <label class="checkbox" style="margin:10px 0">
          <input type="checkbox" id="pair-delete">
          <span>コピー元にないファイルをコピー先で削除</span>
        </label>
      </div>
      <div class="modal-footer">
        <button class="btn btn-outline" onclick="closeModal()">キャンセル</button>
        <button class="btn btn-pastel" onclick="saveSyncPair()">追加</button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast"></div>
  <script src="/js/app.js?v=7"></script>
</body>
</html>
